<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Private S3 Package Repo">
  <rect width="32" height="32" rx="8" fill="#071014"/>
  <!-- primary bucket (Sydney) -->
  <path d="M4.5 11 h8.5 l-1 8.5 a1 1 0 0 1 -1 0.9 h-4.5 a1 1 0 0 1 -1 -0.9 Z"
        fill="#0a3a45" stroke="#22d3ee" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- replica bucket (Auckland) -->
  <path d="M19 11 h8.5 l-1 8.5 a1 1 0 0 1 -1 0.9 h-4.5 a1 1 0 0 1 -1 -0.9 Z"
        fill="#0a3a45" stroke="#67e8f9" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- replication arrow centered in the gap between buckets -->
  <path d="M14 15.5 h3" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M16.1 14.1 L17.7 15.5 L16.1 16.9" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- private lock shackle over the pair -->
  <path d="M12 9 a4 4 0 0 1 8 0" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/>
</svg>
