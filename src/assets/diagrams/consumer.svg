<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"
  aria-labelledby="title desc">
  <title id="title">Consumer VPC from up-consumer</title>
  <desc id="desc">Per Region, demo.sh creates a private lab VPC with AL2023 and Ubuntu probe EC2s, an S3 gateway endpoint, and SSM interface endpoints. Probes reach the regional package bucket through the gateway with no public IP or NAT.</desc>
  <style><![CDATA[
    .diagram-label { fill: #3d4450; }
    .diagram-caption { fill: #5b6472; font-style: italic; }
    .diagram-title { fill: #1b1f24; font-weight: 700; }
    .diagram-edge { stroke: #6b7280; fill: none; }
    .diagram-edge-fill { fill: #6b7280; }
    .diagram-panel { fill: #f6f7f9; stroke: #d5d9e0; }
    .diagram-region { fill: #eef6f6; stroke: #00A4A6; stroke-width: 1.5; }
    .diagram-region-label { fill: #00A4A6; font-weight: 600; }
    .diagram-vpc { fill: #f7f4ff; stroke: #8C4FFF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .diagram-vpc-label { fill: #8C4FFF; font-weight: 600; }
  ]]></style>

