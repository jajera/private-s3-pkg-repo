  <title id="title">Publish packages, rebuild indexes, then CRR to Auckland</title>
  <desc id="desc">demo.sh publish uploads sample rpm/deb under Packages/ and pool/ on the Sydney primary. EventBridge invokes rebuild Lambda for indexes and catalog.json. Publish waits until packages plus indexes appear on the Auckland replica.</desc>
